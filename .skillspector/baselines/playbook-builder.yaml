# SkillSpector baseline: line-independent rules for findings reviewed and accepted.
# Each rule is narrow (rule id + file + matched text) so new findings still surface.
version: 2
scanner_version: '2.12.0'
rules:
  - id: 'AE1'
    path: 'SKILL.md'
    message: '*references/*(partial)*'
    reason: 'Reviewed 2026-11-19: scanner could not fully analyse a large reference file; no hidden or encoded text found'
  - id: 'LP3'
    path: 'SKILL.md'
    reason: 'Reviewed 2026-11-19: no tool scope by design; the skill needs shell and file access'
  - id: 'SC2'
    path: 'scripts/*.sh'
    message: '*$BASE_URL*'
    reason: 'Reviewed 2026-11-19: curl goes to the user-supplied TIP instance with the user''s own key; that is the skill''s purpose'
  - id: 'E1'
    path: 'scripts/push_playbook.sh'
    message: '*-H "$AUTH"*'
    reason: 'Reviewed 2026-11-19: posts the edited playbook definition to the user-supplied TIP instance, after user confirmation'
  - id: 'E1'
    path: 'scripts/test_webhook.sh'
    message: '*curl rejects raw spaces*'
    reason: 'Reviewed 2026-11-19: code comment about URL encoding'
  - id: 'EA2'
    path: 'SKILL.md'
    message: '*without asking*'
    reason: 'Reviewed 2026-11-19: guidance text telling the agent what not to do without asking'
  - id: 'TT2'
    path: 'references/example_build_playbook.py'
    message: '*thp_new.json*'
    reason: 'Reviewed 2026-11-19: example script writes a local working file'
fingerprints: []
