# SkillSpector baseline: line-independent rules for findings reviewed and accepted.
# Each rule is narrow (rule id + file + matched text) so new findings still surface.
version: 2
scanner_version: '2.12.0'
rules:
  - id: 'AE1'
    path: 'SKILL.md'
    message: '*references/*(partial)*'
    reason: 'Reviewed 2026-11-19: scanner could not fully analyse a large reference file; no hidden or encoded text found'
  - id: 'LP3'
    path: 'SKILL.md'
    reason: 'Reviewed 2026-11-19: no tool scope by design; the skill needs shell and file access'
  - id: 'P6'
    path: 'references/best_practices.md'
    message: '*print rules*'
    reason: 'Reviewed 2026-11-19: an FTL/print-layout topic, not a prompt-extraction attempt'
  - id: 'PE3'
    path: 'references/playbook_apps_index.md'
    message: '*Access Token*'
    reason: 'Reviewed 2026-11-19: name of a playbook app in a documentation index'
  - id: 'PE3'
    path: 'scripts/fetch_playbook.sh'
    message: '*.env*'
    reason: 'Reviewed 2026-11-19: reads the user''s own env file holding their TIP key'
  - id: 'SC2'
    path: 'scripts/fetch_playbook.sh'
    message: '*$AUTH_HEADER*'
    reason: 'Reviewed 2026-11-19: curl goes to the user-supplied TIP instance with the user''s own key'
  - id: 'EA2'
    path: 'references/best_practices.md'
    message: '*without checking*'
    reason: 'Reviewed 2026-11-19: review-checklist wording'
  - id: 'SC2'
    path: 'scripts/fetch_app_doc.sh'
    message: '*--proto*'
    reason: 'Reviewed 2026-11-19: https-only curl to the public ThreatConnect docs host; the script rejects any other host'
fingerprints: []
